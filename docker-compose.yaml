version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: friend_recommendation_neo4j
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    ports:
      - "7688:7687"  # Bolt (7687 is already used by another Neo4j)
      - "7475:7474"  # HTTP
      - "7476:7473"  # HTTPS
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs

volumes:
  neo4j_data:
  neo4j_logs: